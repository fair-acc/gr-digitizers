sonar.projectKey=fair-acc_gr-digitizers
sonar.organization=fair-acc
sonar.cfamily.cpp23.enabled=true
# the coverage job's qualitybot report (llvm-cov show)
sonar.cfamily.llvm-cov.reportPath=coverage-report/coverage.txt
sonar.sources=.
sonar.tests=.
sonar.exclusions=**/test/**/*,.ccache/**/*,.gr4-devtools/**/*,coverage-report/**/*
sonar.coverage.exclusions=cmake/**,docker/**/*,blocklib/*/src/**
sonar.test.inclusions=**/test/**/*
sonar.cfamily.compile-commands=../build/compile_commands.json
