# GR4's quality bots (fair-acc/gnuradio4 devtools/qualitybot.cpp) on this tree: each key overrides GR4's value
marker             = gr-digitizers
author             = gr-digitizers metrics
namingArguments    = --root blocklib
codeStyleArguments = --root blocklib/picoscope --root blocklib/timing --root blocklib/opencmw
coverageAreas      = picoscope=blocklib/picoscope/ timing=blocklib/timing/ opencmw=blocklib/opencmw/
coverageBuild      = the instrumented Clang 21 build (libc++, against the prebuilt GR4)
coverageExcluded   = (/_deps/|/test/|/usr/|/opt/|/build/|/\.gr4-devtools/|/blocklib/[^/]+/src/)
# bumped by hand when the coverage job's instrumentation flags change
coverageMethod     = clang-21/llvm-cov-21/1
# nothing to measure yet: no bm_ benchmark, no shipped wasm module
hotPathBenchmarks  =
hotPathBinaries    =
wasmModules        =
